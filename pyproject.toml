[project]
name = "should-i-take-this-train"
version = "0.1.0"
description = "Predict delays and crowding on Mumbai local trains."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "pdfplumber>=0.11.10",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
]

[project.scripts]
sitt-init-db = "sitt.db.database:main"
sitt-bot = "sitt.bot.app:main"
sitt-block = "sitt.ingest.blocks:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sitt"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
