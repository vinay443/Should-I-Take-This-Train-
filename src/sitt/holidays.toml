# Movable holidays on which Mumbai suburban trains run to the Sunday timetable.
#
# Central Railway's list ("LIST OF HOLIDAYS ON WHICH TRAINS WILL RUN AS PER SUNDAY SCHEDULE",
# a PDF beside the timetables on cr.indianrailways.gov.in) names six fixed dates, which
# are in sitt/holidays.py, and these movable ones, each "as per calendar":
#
#   Holi (2nd day), Gudi Padwa, Good Friday, Ramzan-Id, Ganesh Chaturthi, Dassera,
#   Diwali (1st and 2nd day)
#
# The railway doesn't publish the dates, so they are taken from the Maharashtra
# government's yearly list of public holidays. Add each new year here when that list
# comes out (usually November or December of the year before).
#
# One [[holiday]] table per date:
#
#   date    the date, written 2026-10-20 (no quotes)
#   name    which holiday in the railway's list
#   status  "confirmed"  seen in an official document, or fixed by calculation
#           "reported"   several sources quote the official notification with the same
#                        date, but the official document itself was not opened
#           "tentative"  not officially notified yet; from calendars, and may be a day out
#   source  where the date comes from, and when it was checked
#   note    optional: anything doubtful
#
# "confirmed" and "reported" dates are used. "tentative" dates are NOT used unless
# SITT_HOLIDAYS_INCLUDE_TENTATIVE=true, so a date that might be a day out can't quietly
# change which timetable the project thinks is running. To correct an entry, edit its
# date and status here; nothing else needs to change.
#
# Checked on 2026-10-05. The official Maharashtra pages could not be opened that day
# (one refused the connection's certificate, one had no list on it), so no 2026 date is
# marked "confirmed" except Good Friday, which follows from the date of Easter.

# --- 2026: Maharashtra General Administration Department notification for 2026 ---

